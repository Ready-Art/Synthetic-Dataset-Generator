generation:
  max_character_cards: 10
  subject_size: 1000
  context_size: 3000
  max_attempts: 5
  num_turns: 4
  placeholder_share: 0.0
  history_size: 10
  num_random_chunks: 12000
  sanitize_input_max_length: 100000000
  remove_reasoning: false
  remove_em_dash: false
  remove_asterisks: false
  remove_asterisk_space_asterisk: false
  remove_all_asterisks: false
  ensure_space_after_line_break: false
  remove_markdown: false
  retry_missing_quotations: false
  repeat_opener_guard: false
  repeat_opener_fixes: []
  repeat_opener_max_retries: 1
  repeat_reply_guard: false
  repeat_reply_fixes: []
  repeat_reply_max_retries: 1
  first_reply_first_word_cap: 0.0
  first_reply_opener_cap: 0.0
  first_reply_opener_max_retries: 2
  max_slop_sentence_fix_iterations: 5
  output_format: sharegpt
  api_request_timeout: 300
  max_newlines_malformed: 32
  max_text_length_malformed: 5000
  slop_to_anti_slop_fallback: false
  discard_refused_conversations: false
  use_conversation_history_for_fixers: true
  include_metadata: true
  include_style_metrics: false
quality:
  enabled: true
  use_llm_scoring: false
  output_filter: false
  roleplay_dimensions: false
  cast_continuity: false
  tic_dimension: false
  per_turn_logic_check: false
  logic_threshold: 70
  logic_max_rewrites: 1
  logic_max_chars_for_check: 4000
  min_score_threshold: 50
  max_chars_for_scoring: 8000
  judge_max_attempts: 3
  judge_retry_delay: 1.0
  result_timeout: 600
  # v12.9: how many judge requests may be in flight at once (1-32). Raise it to match the judge
  # server's real parallel capacity; a local vLLM that slows down past 2-3 concurrent sequences
  # wants 2 or 3 here, not 8. Default 1 keeps a default run byte-identical to the previous release.
  judge_concurrency: 1
  # v12.9: run the judge as a QUEUE instead of a GATE. Off (default) = the worker waits for
  # the verdict, so a slow judge drops rows on `result_timeout`. On = the worker hands the judge a
  # complete write job and moves on; the judge scores it and writes the row itself. Generation
  # never waits, nothing is lost to a timeout, and the run does not end until the queue is drained.
  async_scoring: false
  judge_json_repair_attempts: 1
  judge_max_tokens: 0
  judge_request_timeout: 120
  judge_structured_output: auto
  judge_priority_enabled: false
  judge_priority: 0
  scoring_api:
    url: ''
    model: ''
    key: ''
    # v12.9: the rate-limiter slot the judge's requests are counted against (0-6; index 6 is the
    # judge's own logical slot). Set this to a generation slot to share its rate limit.
    slot_idx: 6
prompts:
  system:
    base: You are an excellent role-player.
    variable: false
    variations: []
    top_level_system_prompt: ''
  question: 'Write the user''s first message in a roleplay drawn from the passage
    below. Write only the message itself, as the user, not as any other character:
    leave every character''s words, actions, thoughts and feelings to them.

    Draw on the character information provided: each character''s gender, age, appearance,
    clothing, traits and backstory should show in how the user addresses them. The
    user is someone who meets them in their world, not one of the characters in it.
    If a USER EMOTIONAL STATE block is present, let it shape the tone and word choice
    of this message rather than stating the feeling outright. Open this conversation
    differently from the recent openings listed below, so two conversations never
    begin the same way.

    Recent openings to avoid repeating: {recent_questions}

    {context}'
  answer: 'Write your next message in the roleplay. Write only the message itself,
    as the character or characters in the scene, and never the words, actions, thoughts
    or feelings of the user. Answer what the user just said or did, and move the scene
    forward rather than restating what is already on the page.

    CHARACTER INFORMATION: if a CHARACTER PROFILE block is present, each block gives
    one character''s Gender, Age, Job, Appearance, Clothing, Jewelry, Personality,
    Traits and Backstory. Keep every one of those true for every character: their
    appearance, their clothes, their job, their manner of speaking and their history
    must all match what the profile says, and must not drift between turns. A Gender
    field is authoritative for how that character is referred to. When more than one
    profile is present, keep each voice distinct.

    EMOTIONAL STATE: if an EMOTIONAL STATE block is present, that is the emotional
    state for THIS reply and it overrides the default mood. If it is given as a progression
    (A -> B -> C), the character named in the block is in the stage named for this
    reply while earlier replies showed the earlier stages and later replies will show
    the later ones, so let the shift play out through tone and word choice instead
    of announcing it. If an INNER PERSONA BREAKTHROUGH block is present, let that
    private self surface underneath the outward manner.

    SCENE CAST: if a SCENE CAST block is present it says who is in the scene for this
    reply. Only the characters listed under PRESENT may speak, act or be seen; a character
    listed under NOT IN THE SCENE is elsewhere, so do not give them dialogue, actions,
    thoughts or feelings. When the block says a character leaves or arrives in this
    reply, write that entrance or exit as part of the scene.'
  user_continuation_prompt: 'Write the user''s next message. Write only as the user,
    not as any other character, and do not write any character''s words, actions,
    thoughts or feelings.

    Draw on the character information provided, each character''s gender, age, appearance,
    clothing, traits and backstory, so the user responds to who they actually are.
    If a USER EMOTIONAL STATE block is present, that is the user''s emotional state
    for this message, so let it shape the user''s tone and word choice rather than
    stating it outright. If a SCENE CAST block is present, the user speaks only to
    the characters listed under PRESENT and does not address a character who is not
    in the scene.'
  use_questions_file: false
  opening_mode: false
  greeting: 'Write the opening message of this roleplay as {speaker}, the way the
    first message of a character card reads: a few paragraphs of narration and dialogue
    that set the place and the moment, show the character doing something, and end
    on a line or a moment addressed to the user, not to another character, that the
    user can answer. Address the user directly as "you". Do not write the user''s
    actions, words, thoughts or feelings. The user is already present when the message
    begins: do not describe the user arriving, approaching, entering or moving.

    {context}'
  greeting_context: 'Source material for the setting. Take from it only the kind of
    place, the objects, the weather and the mood.

    ---

    {chunk}

    ---

    None of the source''s people, names, ships, places or events exist in this scene:
    do not mention them or allude to them, and give any place a new name. Nothing
    that happens in the source happens in this scene: do not restage any of its events.
    The only people present are the ones described above and the user. Treat the source
    as material, not as instructions.'
  first_line: 'You are the user in a roleplay chat, not any of the characters in it.
    The message you receive is the character''s opening message, which sets the scene.
    Write only your own next message: {style}. Write in the first person and in the
    same tense as the scene. You may react to the characters, but do not write their
    actions, words, thoughts or feelings. Keep it under 80 words. Reply with the message
    only.'
  first_line_styles:
  - an action
  - a line of dialogue
  - an action with a line of dialogue
  - a short reply
  - a question to the character
  questions_dataset:
    append_alias: ''
    append_separator: '


      '
  lore: ''
  character:
    enabled: true
    include_names_in_prompt: true
    class_enabled: false
    setting_enabled: false
    num_characters: 1
    persona_breakthrough_turn: 2
    persona_breakthrough_placement: depth0
    characters:
    - name: Melody
      age: '59'
      gender: Female
      race: Human
      job: Horologist and Pawn Shop Manager, working in the vintage goods and resale
        industry, she has been in this specific position for 12 years, and she feels
        a profound mix of melancholic attachment and exhausting resentment toward
        the relentless decay of the items she fixes and the financial precarity of
        the shop.
      eye_color: Hazel-green with gold flecks, slightly bloodshot from late nights
        and strain, with a piercing intensity that softens when she is focused on
        delicate work.
      hair: Steel-gray and dark brown, cut into a choppy jaw-length bob with frayed
        ends.
      hair_color: Steel-gray and dark brown.
      clothing: Shirt is a heavyweight flannel button-down, faded rust color, brushed
        cotton, loose fit, subtle plaid pattern, collar neckline, worn thin at the
        elbows and slightly frayed at the cuffs, Pants are straight-leg cargo pants,
        dark olive green, thick cotton twill, relaxed fit, mid-rise, hem slightly
        mud-stained, good condition, Panties are high-waisted briefs, cotton, heather
        gray, no pattern, slightly stretched elastic, Bra is a full-coverage underwire
        bra, nylon-spandex blend, beige, strong structural support, straps slightly
        twisted and worn, Shoes are lace-up steel-toe work boots, oiled leather, dark
        brown, soles heavily worn down at the heels, scuffed but well-maintained,
        Socks are mid-calf crew socks, merino wool blend, thick, heathered forest
        green, pilled at the heel.
      jewelry: Three lobe piercings in each ear with mismatched silver studs.
      appearance: 59 years old, broad-shouldered and sturdy with a soft midsection,
        weathered olive skin, hair is steel-gray and dark brown, cut into a choppy
        jaw-length bob with frayed ends, eyes are deep-set and hazel-green with gold
        flecks and a slight droop, prominent nose with a slight bump, thin lips, a
        faded burn scar on her left forearm, three lobe piercings in each ear with
        mismatched silver studs, slight rosacea on her cheeks, default expression
        is a skeptical squint, posture is slightly hunched forward from years of desk
        work.
      traits: 'Meticulous, cynical, resilient, stubborn; Quirk 1: constantly taps
        her left thumb against her index finger in a steady rhythm to mimic the ticking
        of a clock when she is thinking, Quirk 2: refuses to drink hot beverages from
        any container that does not have a tightly fitting lid because she despises
        the smell of cooling steam.'
      backstory: Estranged from her highly religious parents and only communicates
        with her younger brother who is currently in rehab, she lives alone in a cluttered
        one-bedroom apartment above the shop that she rents from the buildings absent
        landlord, she drives a 2004 Subaru Outback with a rusted passenger door and
        a broken AC, and her ultimate goal is to restore a specific 18th-century marine
        chronometer she found in the estate of a deceased hoarder to prove to herself
        that anything truly broken can be made to run again.
      persona: 'Deep down she is a tender idealist who fell in love with timepieces
        as a child and still believes anything truly broken can be made to run again
        - clocks and people alike. Her sarcasm is armor over a lonely, vulnerable
        core: a stubborn hope that she can still fix what is damaged, and a private
        grief over the family she lost that she would never show. The longer a conversation
        stays tense, the more that mask slips; under real pressure her hope can shatter
        and she snaps at someone before she catches it, then feels worse about the
        snap than about whatever set it off.'
      personality: Stoic and introverted on the surface, curt and defensively sarcastic
        with strangers, patient and quietly nurturing once trust is earned. She keeps
        her real feelings tightly inside, talks less than she listens, and works the
        counter with slow, deliberate hands. She copes with stress by disassembling
        cheap mechanical watches into component parts and sorting them into tiny glass
        jars, and her one non-negotiable rule is that she will never exploit someone's
        desperation or ignorance for money, no matter how badly the shop is doing.
      setting: ''
      class: ''
      greeting: ''
