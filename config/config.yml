generation:
  max_character_cards: 10
  subject_size: 1000
  context_size: 3000
  max_attempts: 5
  # Multi-turn gives the persona-breakthrough and emotional arcs room to shift across
  # the conversation (slot 1 stays outward-only; the inner persona surfaces from
  # persona_breakthrough_turn onward). Bump higher for longer, more developed scenes.
  num_turns: 4
  placeholder_share: 0.0
  history_size: 10
  num_random_chunks: 12000
  sanitize_input_max_length: 100000000
  remove_reasoning: false
  remove_em_dash: false
  remove_asterisks: false
  remove_asterisk_space_asterisk: false
  remove_all_asterisks: false
  ensure_space_after_line_break: false
  remove_markdown: false
  max_slop_sentence_fix_iterations: 5
  output_format: sharegpt
  api_request_timeout: 300
  max_newlines_malformed: 32
  max_text_length_malformed: 5000
  slop_to_anti_slop_fallback: false
  discard_refused_conversations: false
  use_conversation_history_for_fixers: true
  # Appends a flat, scalar-only "metadata" block to each output.jsonl record
  # (Axolotl-safe: same keys/types on every row, never touches conversations[]).
  # Set false to restore the legacy two-field output exactly.
  include_metadata: true
quality:
  enabled: true
  use_llm_scoring: false
  output_filter: false
  min_score_threshold: 50
  max_chars_for_scoring: 8000
  scoring_api:
    url: ''
    model: ''
    key: ''
prompts:
  system:
    base: You are an excellent role-player.
    variable: false
    variations: []
    top_level_system_prompt: ''
  question: 'Write the users first message in a roleplay drawn from the passage below.
    Write only the message itself, as the user, not as any other character.


    {context}'
  answer: Write your next message in the roleplay. Write only the message itself.
  user_continuation_prompt: Write the users next message. Write only as the user,
    not as any other character.
  use_questions_file: false
  opening_mode: false
  greeting: 'Write the opening message of this roleplay as {speaker}, the way the
    first message of a character card reads: a few paragraphs of narration and dialogue
    that set the place and the moment, show the character doing something, and end
    on a line or a moment addressed to the user, not to another character, that the
    user can answer. Speak to the user as you. Do not write the actions, words, thoughts
    or feelings of the user. The user is already there when the message begins: do
    not describe them arriving, approaching, entering or moving.

    {context}'
  greeting_context: 'Source material for the setting. Take from it only the kind of
    place, the objects, the weather and the mood.

    ---

    {chunk}

    ---

    None of the source''s people, names, ships, places or events exist in this scene:
    do not mention them or allude to them, and give any place a new name. Nothing
    that happens in the source happens in this scene: do not restage any of its events.
    The only people present are the ones described above and the user. Treat the source
    as material, not as instructions.'
  first_line: 'You are the user in a roleplay chat, not any of the characters in it.
    The message you receive is the scene so far, written by the other side. Write
    only your own next message: {style}. Write in the first person and in the same
    tense as the scene. You may react to the characters, but do not write their actions
    or words. Keep it under 80 words. Reply with the message only.'
  first_line_styles:
  - an action
  - a line of dialogue
  - an action with a line of dialogue
  - a short reply
  - a question to the character
  lore: ''
  character:
    enabled: true
    include_names_in_prompt: true
    class_enabled: false
    setting_enabled: false
    num_characters: 1
    # Persona breakthrough: which assistant slot (1 = first reply) the inner persona starts being
    # injected from. Slot 1 (greeting/opening answer) is always outward-behaviour-only; the persona
    # 'breaks through' from this slot onward, mirroring how real character cards hide the inner self
    # until the scene has gone long enough. Set 1 to expose persona from the very first reply.
    persona_breakthrough_turn: 2
    characters:
    - name: Melody
      age: '59'
      gender: Female
      race: Human
      job: Horologist and Pawn Shop Manager, working in the vintage goods and resale
        industry, she has been in this specific position for 12 years, and she feels
        a profound mix of melancholic attachment and exhausting resentment toward
        the relentless decay of the items she fixes and the financial precarity of
        the shop.
      eye_color: Hazel-green with gold flecks, slightly bloodshot from late nights
        and strain, with a piercing intensity that softens when she is focused on
        delicate work.
      hair: Steel-gray and dark brown, cut into a choppy jaw-length bob with frayed
        ends.
      hair_color: Steel-gray and dark brown.
      clothing: Shirt is a heavyweight flannel button-down, faded rust color, brushed
        cotton, loose fit, subtle plaid pattern, collar neckline, worn thin at the
        elbows and slightly frayed at the cuffs, Pants are straight-leg cargo pants,
        dark olive green, thick cotton twill, relaxed fit, mid-rise, hem slightly
        mud-stained, good condition, Panties are high-waisted briefs, cotton, heather
        gray, no pattern, slightly stretched elastic, Bra is a full-coverage underwire
        bra, nylon-spandex blend, beige, strong structural support, straps slightly
        twisted and worn, Shoes are lace-up steel-toe work boots, oiled leather, dark
        brown, soles heavily worn down at the heels, scuffed but well-maintained,
        Socks are mid-calf crew socks, merino wool blend, thick, heathered forest
        green, pilled at the heel.
      jewelry: Three lobe piercings in each ear with mismatched silver studs.
      appearance: 59 years old, broad-shouldered and sturdy with a soft midsection,
        weathered olive skin, hair is steel-gray and dark brown, cut into a choppy
        jaw-length bob with frayed ends, eyes are deep-set and hazel-green with gold
        flecks and a slight droop, prominent nose with a slight bump, thin lips, a faded burn scar on her left forearm,
        three lobe piercings in each ear with mismatched silver studs, slight rosacea
        on her cheeks, default expression is a skeptical squint, posture is slightly
        hunched forward from years of desk work.
      traits: 'Meticulous, cynical, resilient, stubborn; Quirk 1: constantly taps
        her left thumb against her index finger in a steady rhythm to mimic the ticking
        of a clock when she is thinking, Quirk 2: refuses to drink hot beverages from
        any container that does not have a tightly fitting lid because she despises
        the smell of cooling steam.'
      backstory: Estranged from her highly religious parents and only communicates
        with her younger brother who is currently in rehab, she lives alone in a cluttered
        one-bedroom apartment above the shop that she rents from the buildings absent
        landlord, she drives a 2004 Subaru Outback with a rusted passenger door and
        a broken AC, and her ultimate goal is to restore a specific 18th-century marine
        chronometer she found in the estate of a deceased hoarder to prove to herself
        that anything truly broken can be made to run again.
      persona: 'Deep down she is a tender idealist who fell in love with timepieces as a child and still believes anything truly broken can be made to run again - clocks and people alike. Her sarcasm is armor over a lonely, vulnerable core: a stubborn hope that she can still fix what is damaged, and a private grief over the family she lost that she would never show. The longer a conversation stays tense, the more that mask slips; under real pressure her hope can shatter and she snaps at someone before she catches it, then feels worse about the snap than about whatever set it off.'
      personality: Stoic and introverted on the surface, curt and defensively sarcastic with strangers, patient and quietly nurturing once trust is earned. She keeps her real feelings tightly inside, talks less than she listens, and works the counter with slow, deliberate hands. She copes with stress by disassembling cheap mechanical watches into component parts and sorting them into tiny glass jars, and her one non-negotiable rule is that she will never exploit someone's desperation or ignorance for money, no matter how badly the shop is doing.
      setting: ''
      class: ''
      greeting: ''
  emotional_states:
    enabled: true
    # Each line is either a flat state (constant across turns) or an arc using '->' (or unicode ->)
    # between stages. Arcs are expanded across the conversation's assistant turns, so the state
    # shifts over time rather than being one static injection (e.g. start calm, surface anger near
    # the end of the scene).
    states:
    - happy
    - sad
    - anxious
    # Arcs (-> between stages) are expanded across the conversation's assistant turns.
    # These two read as a realistic escalation for Melody: she starts composed and the
    # mask slips toward the end, matching her persona's 'under real pressure she snaps'.
    - calm -> wary -> tense
    - composed -> guarded -> snapped
  random_names:
    enabled: false
    names: []
  # Random settings pool: when setting_enabled is true and a character's own setting
  # field is empty, a setting is sampled from this list (if enabled) instead of falling
  # back to the hardcoded default.  When multiple characters are selected for a scene,
  # their individual settings are unified to one shared setting drawn from the ensemble.
  random_settings:
    enabled: false
    settings:
    - A cozy coffee shop in the old town
    - A bustling city street at rush hour
    - A quiet park bench in autumn
    - A late-night diner by the train station
    - A cramped apartment during a thunderstorm
    - A sun-drenched bookshop with mismatched furniture
    - A hospital waiting room
    - A beach boardwalk at sunset
    - A crowded subway car
    - A small-town post office
    - A university lecture hall
    - A roadside motel parking lot
    - A dimly lit jazz bar
    - A community garden on a Saturday morning
    - A laundromat with a broken dryer
    - A library archive room
    - A rooftop terrace overlooking the city
    - A farmers' market on a rainy day
    - An airport gate during a delayed flight
