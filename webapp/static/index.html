<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReadyArt Synthetic Dataset Generator</title>

</head>
<body>
  <div class="app" id="app">
    <header class="topbar">

  <script type="module" src="/static/js/main.js"></script>
